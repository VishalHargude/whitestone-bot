name: Automated Cloud Meditation Video Publisher

on:
  schedule:
    # 1. 06:30 AM IST (01:00 UTC) - 1-Hour Morning Dhyana
    - cron: '0 1 * * *'
    # 2. 02:30 PM IST (09:00 UTC) - 1-Hour Afternoon Zen
    - cron: '0 9 * * *'
    # 3. 09:30 PM IST (16:00 UTC) - 2-Hour Deep Sleep Meditation
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Video Duration (Minutes)'
        required: true
        default: '60'
        type: choice
        options:
          - '60'
          - '120'
          - '180'
          - '30'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install imageio-ffmpeg pillow requests google-api-python-client google-auth-oauthlib google-auth-httplib2 schedule

      - name: Restore Credentials from GitHub Secrets
        env:
          CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_BASE64 }}
          TOKEN_PICKLE_B64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_BASE64 }}
        run: |
          if [ -n "$CLIENT_SECRET_B64" ]; then
            echo "$CLIENT_SECRET_B64" | base64 -d > client_secret.json
          fi
          if [ -n "$TOKEN_PICKLE_B64" ]; then
            echo "$TOKEN_PICKLE_B64" | base64 -d > youtube_direct_token.pickle
            echo "$TOKEN_PICKLE_B64" | base64 -d > token.pickle
          fi

      - name: Generate & Upload Long-Form Meditation Video
        run: |
          DUR="${{ inputs.duration_minutes }}"
          if [ -z "$DUR" ]; then
            DUR="60"
          fi
          python meditation_scheduler.py --now --duration "$DUR"
