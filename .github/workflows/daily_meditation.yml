name: Automated Cloud Meditation Video Publisher

on:
  schedule:
    # 1. 06:15 AM IST (00:45 UTC) - 1-Hour Morning Dhyana (Asia Morning & US Night)
    - cron: '45 0 * * *'
    # 2. 11:45 AM IST (06:15 UTC) - 1-Hour Midday Stress Relief (EU Morning)
    - cron: '15 6 * * *'
    # 3. 04:45 PM IST (11:15 UTC) - 1-Hour Sunset Zen & Mindful Focus (EU Afternoon & US Morning)
    - cron: '15 11 * * *'
    # 4. 09:45 PM IST (16:15 UTC) - 2-Hour Deep Sleep Meditation (Asia Bedtime & US Midday)
    - cron: '15 16 * * *'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Video Duration (Minutes)'
        required: true
        default: '60'
        type: choice
        options:
          - '60'
          - '120'
          - '180'
          - '30'

concurrency:
  group: meditation-cloud-publisher
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify & Setup FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install Python Requirements
        run: |
          pip install --no-cache-dir imageio-ffmpeg pillow requests google-api-python-client google-auth-oauthlib google-auth-httplib2 schedule

      - name: Restore Credentials from GitHub Secrets
        env:
          CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_BASE64 }}
          TOKEN_PICKLE_B64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_BASE64 }}
        run: |
          if [ -n "$CLIENT_SECRET_B64" ]; then
            echo "$CLIENT_SECRET_B64" | base64 -d > client_secret.json
          fi
          if [ -n "$TOKEN_PICKLE_B64" ]; then
            echo "$TOKEN_PICKLE_B64" | base64 -d > youtube_direct_token.pickle
            echo "$TOKEN_PICKLE_B64" | base64 -d > token.pickle
          fi

      - name: Generate & Upload Long-Form Meditation Video
        run: |
          DUR="${{ inputs.duration_minutes }}"
          if [ -z "$DUR" ]; then
            CURRENT_HOUR=$(date -u +%H)
            if [ "$CURRENT_HOUR" = "16" ]; then
              DUR="120"
            else
              DUR="60"
            fi
          fi
          python meditation_scheduler.py --now --duration "$DUR"
